<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1D33"/><stop offset="1" stop-color="#12304F"/></linearGradient></defs>

<style>
 .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
 .h1{font-size:30px;font-weight:700;fill:#FFFFFF}
 .h2{font-size:15px;font-weight:600;fill:#9FD8F5}
 .lab{font-size:13px;fill:#C9DCEB}
 .sm{font-size:12px;fill:#8FB0CB}
 .val{font-size:13px;font-weight:700;fill:#FFFFFF}
 .big{font-size:28px;font-weight:700}
 .chip{font-size:12px;font-weight:600;fill:#0B1D33}
 .f{opacity:0;animation:f .7s ease-out forwards}
 .gx{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gx 1.1s cubic-bezier(.2,.8,.2,1) forwards}
 .gy{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:gy 1s cubic-bezier(.2,.8,.2,1) forwards}
 .glow{animation:glow 3s ease-in-out infinite}
 .cta{animation:cta 2.2s ease-in-out 1.5s infinite}
 @keyframes f{to{opacity:1}}
 @keyframes gx{to{transform:scaleX(1)}}
 @keyframes gy{to{transform:scaleY(1)}}
 @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
 @keyframes cta{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
</style>
<rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#bg)"/>
<rect class="glow" x="1" y="1" width="1198" height="298" rx="20" fill="none" stroke="#7CF5C4" stroke-width="2"/>
<rect x="1" y="30" width="6" height="240" rx="3" fill="#7CF5C4"/>
<g class="t">
<text class="h1 f" x="40" y="58">📊 Byte Supply — E-Commerce Business Analytics</text>
<text class="h2 f" style="animation-delay:.15s" x="40" y="86">Individual project · Oct 2026 · Live Plotly dashboard</text>
<g class="f" style="animation-delay:0.3s"><rect x="40" y="102" width="59" height="24" rx="12" fill="#9FD8F5"/><text class="chip" x="70" y="118" text-anchor="middle">pandas</text></g><g class="f" style="animation-delay:0.35s"><rect x="107" y="102" width="52" height="24" rx="12" fill="#9FD8F5"/><text class="chip" x="133" y="118" text-anchor="middle">NumPy</text></g><g class="f" style="animation-delay:0.39999999999999997s"><rect x="167" y="102" width="102" height="24" rx="12" fill="#7CF5C4"/><text class="chip" x="218" y="118" text-anchor="middle">scikit-learn</text></g><g class="f" style="animation-delay:0.44999999999999996s"><rect x="278" y="102" width="88" height="24" rx="12" fill="#7CF5C4"/><text class="chip" x="322" y="118" text-anchor="middle">Matplotlib</text></g><g class="f" style="animation-delay:0.49999999999999994s"><rect x="374" y="102" width="66" height="24" rx="12" fill="#7CF5C4"/><text class="chip" x="407" y="118" text-anchor="middle">Seaborn</text></g><g class="f" style="animation-delay:0.5499999999999999s"><rect x="448" y="102" width="66" height="24" rx="12" fill="#FFD27F"/><text class="chip" x="481" y="118" text-anchor="middle">Jupyter</text></g>
<g class="f" style="animation-delay:0.5s"><rect x="40" y="150" width="200" height="74" rx="12" fill="#123A5E"/><text class="big" x="56" y="188" fill="#4FC3F7">24,991</text><text class="lab" x="56" y="210">transactions · 5 years</text></g><g class="f" style="animation-delay:0.65s"><rect x="255" y="150" width="200" height="74" rx="12" fill="#123A5E"/><text class="big" x="271" y="188" fill="#7CF5C4">RM 2.04M</text><text class="lab" x="271" y="210">revenue analysed</text></g><g class="f" style="animation-delay:0.8s"><rect x="470" y="150" width="200" height="74" rx="12" fill="#123A5E"/><text class="big" x="486" y="188" fill="#FFD27F">36.5%</text><text class="lab" x="486" y="210">gross margin</text></g>
<text class="h2 f" style="animation-delay:0.6s" x="730" y="160">12-month revenue forecast (R²)</text><text class="lab f" style="animation-delay:0.6s" x="730" y="193">Linear</text><rect x="850" y="178" width="250" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.04"/><rect class="gx" style="animation-delay:0.8s" x="850" y="178" width="37.5" height="20" rx="4" fill="#4A6178"/><text class="val f" style="animation-delay:1.5s" x="895.5" y="193">0.15</text><text class="lab f" style="animation-delay:0.6s" x="730" y="227">Polynomial</text><rect x="850" y="212" width="250" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.04"/><rect class="gx" style="animation-delay:1.05s" x="850" y="212" width="135.0" height="20" rx="4" fill="#1E9BD7"/><text class="val f" style="animation-delay:1.75s" x="993.0" y="227">0.54</text>
<g class="f" style="animation-delay:1.4s"><text class="sm cta" x="1160" y="282" text-anchor="end">Open repository →</text></g>
</g></svg>