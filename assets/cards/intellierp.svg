<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1D33"/><stop offset="1" stop-color="#12304F"/></linearGradient></defs>

<style>
 .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
 .h1{font-size:30px;font-weight:700;fill:#FFFFFF}
 .h2{font-size:15px;font-weight:600;fill:#9FD8F5}
 .lab{font-size:13px;fill:#C9DCEB}
 .sm{font-size:12px;fill:#8FB0CB}
 .val{font-size:13px;font-weight:700;fill:#FFFFFF}
 .big{font-size:28px;font-weight:700}
 .chip{font-size:12px;font-weight:600;fill:#0B1D33}
 .f{opacity:0;animation:f .7s ease-out forwards}
 .gx{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gx 1.1s cubic-bezier(.2,.8,.2,1) forwards}
 .gy{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:gy 1s cubic-bezier(.2,.8,.2,1) forwards}
 .glow{animation:glow 3s ease-in-out infinite}
 .cta{animation:cta 2.2s ease-in-out 1.5s infinite}
 @keyframes f{to{opacity:1}}
 @keyframes gx{to{transform:scaleX(1)}}
 @keyframes gy{to{transform:scaleY(1)}}
 @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
 @keyframes cta{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
</style>
<rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#bg)"/>
<rect class="glow" x="1" y="1" width="1198" height="298" rx="20" fill="none" stroke="#4FC3F7" stroke-width="2"/>
<rect x="1" y="30" width="6" height="240" rx="3" fill="#4FC3F7"/>
<g class="t">
<text class="h1 f" x="40" y="58">🧠 IntelliERP — LLM-Grounded ERP Decision Support</text>
<text class="h2 f" style="animation-delay:.15s" x="40" y="86">Research Internship · INTI International University · Aug – Dec 2026</text>
<g class="f" style="animation-delay:0.3s"><rect x="40" y="102" width="59" height="24" rx="12" fill="#9FD8F5"/><text class="chip" x="70" y="118" text-anchor="middle">Python</text></g><g class="f" style="animation-delay:0.35s"><rect x="107" y="102" width="66" height="24" rx="12" fill="#9FD8F5"/><text class="chip" x="140" y="118" text-anchor="middle">FastAPI</text></g><g class="f" style="animation-delay:0.39999999999999997s"><rect x="182" y="102" width="88" height="24" rx="12" fill="#9FD8F5"/><text class="chip" x="226" y="118" text-anchor="middle">PostgreSQL</text></g><g class="f" style="animation-delay:0.44999999999999996s"><rect x="278" y="102" width="52" height="24" rx="12" fill="#7CF5C4"/><text class="chip" x="304" y="118" text-anchor="middle">React</text></g><g class="f" style="animation-delay:0.49999999999999994s"><rect x="338" y="102" width="88" height="24" rx="12" fill="#7CF5C4"/><text class="chip" x="382" y="118" text-anchor="middle">TypeScript</text></g><g class="f" style="animation-delay:0.5499999999999999s"><rect x="434" y="102" width="88" height="24" rx="12" fill="#FFD27F"/><text class="chip" x="478" y="118" text-anchor="middle">LLMs + RAG</text></g>
<g class="f" style="animation-delay:0.5s"><rect x="40" y="150" width="200" height="74" rx="12" fill="#123A5E"/><text class="big" x="56" y="188" fill="#4FC3F7">231,412</text><text class="lab" x="56" y="210">sales order lines</text></g><g class="f" style="animation-delay:0.65s"><rect x="255" y="150" width="200" height="74" rx="12" fill="#123A5E"/><text class="big" x="271" y="188" fill="#7CF5C4">40+ · 11</text><text class="lab" x="271" y="210">REST APIs · PG tables</text></g><g class="f" style="animation-delay:0.8s"><rect x="470" y="150" width="200" height="74" rx="12" fill="#123A5E"/><text class="big" x="486" y="188" fill="#FFD27F">4 roles</text><text class="lab" x="486" y="210">JWT + RBAC + audit log</text></g>
<text class="h2 f" style="animation-delay:0.6s" x="730" y="160">LLM test accuracy (14 role-scoped tools)</text><text class="lab f" style="animation-delay:0.6s" x="730" y="193">Without grounding</text><rect x="850" y="178" width="250" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.04"/><rect class="gx" style="animation-delay:0.8s" x="850" y="178" width="70.0" height="20" rx="4" fill="#4A6178"/><text class="val f" style="animation-delay:1.5s" x="928.0" y="193">28%</text><text class="lab f" style="animation-delay:0.6s" x="730" y="227">With grounding</text><rect x="850" y="212" width="250" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.04"/><rect class="gx" style="animation-delay:1.05s" x="850" y="212" width="250.0" height="20" rx="4" fill="#1E9BD7"/><text class="val f" style="animation-delay:1.75s" x="1108.0" y="227">100%</text>
<g class="f" style="animation-delay:1.4s"><text class="sm cta" x="1160" y="282" text-anchor="end">Open repository →</text></g>
</g></svg>