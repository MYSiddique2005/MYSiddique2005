<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">

<style>
 .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
 .h1{font-size:30px;font-weight:700;fill:#FFFFFF}
 .h2{font-size:15px;font-weight:600;fill:#9FD8F5}
 .lab{font-size:13px;fill:#C9DCEB}
 .sm{font-size:12px;fill:#8FB0CB}
 .val{font-size:13px;font-weight:700;fill:#FFFFFF}
 .big{font-size:28px;font-weight:700}
 .chip{font-size:12px;font-weight:600;fill:#0B1D33}
 .f{opacity:0;animation:f .7s ease-out forwards}
 .gx{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gx 1.1s cubic-bezier(.2,.8,.2,1) forwards}
 .gy{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:gy 1s cubic-bezier(.2,.8,.2,1) forwards}
 .glow{animation:glow 3s ease-in-out infinite}
 .cta{animation:cta 2.2s ease-in-out 1.5s infinite}
 @keyframes f{to{opacity:1}}
 @keyframes gx{to{transform:scaleX(1)}}
 @keyframes gy{to{transform:scaleY(1)}}
 @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
 @keyframes cta{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
</style>
<rect width="1200" height="300" rx="20" fill="#0B1D33"/><g class="t">
<rect x="24" y="20" width="270" height="260" rx="14" fill="#123A5E" class="f" style="animation-delay:0.1s"/><text class="h2 f" style="animation-delay:0.1s" x="159.0" y="50" text-anchor="middle">Gross margin</text><line x1="54" y1="230" x2="264" y2="230" stroke="#FFFFFF" stroke-opacity=".2"/><rect class="gy" style="animation-delay:0.4s" x="74" y="135.9" width="70" height="94.1" rx="4" fill="#4A6178"/><text class="val f" style="animation-delay:1.1s" x="109.0" y="127.9" text-anchor="middle">25.1%</text><text class="lab f" style="animation-delay:0.1s" x="109.0" y="250" text-anchor="middle">Mega-sale</text><rect class="gy" style="animation-delay:0.7s" x="174" y="92.0" width="70" height="138.0" rx="4" fill="#1E9BD7"/><text class="val f" style="animation-delay:1.4000000000000001s" x="209.0" y="84.0" text-anchor="middle">36.8%</text><text class="lab f" style="animation-delay:0.1s" x="209.0" y="250" text-anchor="middle">Other days</text><text class="sm f" style="animation-delay:1.7000000000000002s" x="159.0" y="272" text-anchor="middle">Byte Supply · discounts cost margin</text>
<rect x="318" y="20" width="270" height="260" rx="14" fill="#123A5E" class="f" style="animation-delay:0.4s"/><text class="h2 f" style="animation-delay:0.4s" x="453.0" y="50" text-anchor="middle">Average rating</text><line x1="348" y1="230" x2="558" y2="230" stroke="#FFFFFF" stroke-opacity=".2"/><rect class="gy" style="animation-delay:0.7s" x="368" y="140.3" width="70" height="89.7" rx="4" fill="#4A6178"/><text class="val f" style="animation-delay:1.4s" x="403.0" y="132.3" text-anchor="middle">2.99</text><text class="lab f" style="animation-delay:0.4s" x="403.0" y="250" text-anchor="middle">Late</text><rect class="gy" style="animation-delay:1.0s" x="468" y="104.0" width="70" height="126.0" rx="4" fill="#1E9BD7"/><text class="val f" style="animation-delay:1.7s" x="503.0" y="96.0" text-anchor="middle">4.20</text><text class="lab f" style="animation-delay:0.4s" x="503.0" y="250" text-anchor="middle">On time</text><text class="sm f" style="animation-delay:2.0s" x="453.0" y="272" text-anchor="middle">Byte Supply · late delivery hurts reviews</text>
<rect x="612" y="20" width="270" height="260" rx="14" fill="#123A5E" class="f" style="animation-delay:0.7s"/><text class="h2 f" style="animation-delay:0.7s" x="747.0" y="50" text-anchor="middle">Forecast R²</text><line x1="642" y1="230" x2="852" y2="230" stroke="#FFFFFF" stroke-opacity=".2"/><rect class="gy" style="animation-delay:1.0s" x="662" y="192.5" width="70" height="37.5" rx="4" fill="#4A6178"/><text class="val f" style="animation-delay:1.7s" x="697.0" y="184.5" text-anchor="middle">0.15</text><text class="lab f" style="animation-delay:0.7s" x="697.0" y="250" text-anchor="middle">Linear</text><rect class="gy" style="animation-delay:1.3s" x="762" y="95.0" width="70" height="135.0" rx="4" fill="#1E9BD7"/><text class="val f" style="animation-delay:2.0s" x="797.0" y="87.0" text-anchor="middle">0.54</text><text class="lab f" style="animation-delay:0.7s" x="797.0" y="250" text-anchor="middle">Polynomial</text><text class="sm f" style="animation-delay:2.3s" x="747.0" y="272" text-anchor="middle">Byte Supply · MAE cut 21.5%</text>
<rect x="906" y="20" width="270" height="260" rx="14" fill="#123A5E" class="f" style="animation-delay:1.0s"/><text class="h2 f" style="animation-delay:1.0s" x="1041.0" y="50" text-anchor="middle">LLM test accuracy</text><line x1="936" y1="230" x2="1146" y2="230" stroke="#FFFFFF" stroke-opacity=".2"/><rect class="gy" style="animation-delay:1.3s" x="956" y="188.0" width="70" height="42.0" rx="4" fill="#4A6178"/><text class="val f" style="animation-delay:2.0s" x="991.0" y="180.0" text-anchor="middle">28%</text><text class="lab f" style="animation-delay:1.0s" x="991.0" y="250" text-anchor="middle">Ungrounded</text><rect class="gy" style="animation-delay:1.6s" x="1056" y="80.0" width="70" height="150.0" rx="4" fill="#1E9BD7"/><text class="val f" style="animation-delay:2.3s" x="1091.0" y="72.0" text-anchor="middle">100%</text><text class="lab f" style="animation-delay:1.0s" x="1091.0" y="250" text-anchor="middle">Grounded</text><text class="sm f" style="animation-delay:2.6s" x="1041.0" y="272" text-anchor="middle">IntelliERP · 41-passage knowledge base</text>
</g></svg>